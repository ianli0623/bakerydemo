# Version-controlled Nginx site for the lularm.com test environment.
#
# Requires the headers-more module on Ubuntu:
#   sudo apt-get install libnginx-mod-http-headers-more-filter
#
# Install as /etc/nginx/sites-available/semi-e187 only after backing up the
# existing file. Reload only when `sudo nginx -t` succeeds.

server {
    listen 80;
    listen [::]:80;
    server_name lularm.com www.lularm.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lularm.com www.lularm.com;
    client_max_body_size 12m;

    server_tokens off;
    more_clear_headers 'Server';
    more_clear_headers 'X-Powered-By';
    more_set_headers "Content-Security-Policy: frame-ancestors 'self'; object-src 'none'; base-uri 'self';";
    more_set_headers "X-Frame-Options: SAMEORIGIN";

    ssl_certificate /etc/letsencrypt/live/lularm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lularm.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location /static/ {
        alias /srv/semi-e187/app/bakerydemo/collect_static/;
        access_log off;
        expires 7d;
    }

    location /media/ {
        alias /srv/semi-e187/app/bakerydemo/media/;
    }

    location ^~ /account/security/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/(admin|django-admin|api/v2|images|documents)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/site-settings/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
